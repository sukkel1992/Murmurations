<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8ece5">
  <title>Murmuration — previewportaal</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #e8ece5;
      --ink: #202923;
      --muted: #647068;
      --line: #c8d0c7;
      --accent: #355c48;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#75887920 .7px, transparent .7px);
      background-size: 9px 9px;
      font: 14px/1.4 ui-sans-serif, sans-serif;
    }
    .portal { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 100vh; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 76px;
      padding: 12px clamp(16px, 4vw, 56px);
      border-bottom: 1px solid var(--line);
    }
    .identity { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
    h1 { margin: 0; font: 500 1.5rem/1 Georgia, serif; }
    .edition { color: var(--muted); font: 11px/1.2 ui-monospace, monospace; text-transform: uppercase; }
    .open-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--accent);
      color: white;
      background: var(--accent);
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }
    .open-link:hover { background: #294a39; }
    .open-link:focus-visible { outline: 3px solid #8aa691; outline-offset: 3px; }
    .arrow { font-size: 1.1em; }
    main { min-height: 0; padding: clamp(12px, 2.2vw, 28px) clamp(12px, 2.4vw, 32px); }
    .preview {
      width: 100%;
      height: 100%;
      min-height: 360px;
      border: 1px solid #323d36;
      background: #080a09;
      box-shadow: 0 12px 36px #27382d20;
    }
    .preview iframe { display: block; width: 100%; height: 100%; min-height: 360px; border: 0; }
    @media (max-width: 540px) {
      header { align-items: flex-start; flex-direction: column; gap: 12px; padding-block: 14px; }
      .identity { align-items: flex-start; flex-direction: column; gap: 5px; }
      h1 { font-size: 1.35rem; }
      main { padding: 10px; }
      .preview, .preview iframe { min-height: calc(100vh - 134px); }
    }
  </style>
</head>
<body>
  <div class="portal">
    <header>
      <div class="identity">
        <h1>Murmuration</h1>
        <span class="edition">Interactieve preview · 2D—4D</span>
      </div>
      <a class="open-link" href="./murmuration-3d/" target="_blank" rel="noopener">
        Open volledige ervaring <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </header>
    <main>
      <section class="preview" aria-label="Preview van de murmuration-animatie">
        <iframe src="./murmuration-3d/" title="Interactieve Murmuration-preview" allow="fullscreen; camera" allowfullscreen></iframe>
      </section>
    </main>
  </div>
</body>
</html>
